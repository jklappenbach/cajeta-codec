# CI + release for the cajeta-codec library (.cja).
#
# Unlike the cajeta compiler's release (which cross-builds binaries), this is a
# pure-Cajeta library: CI installs a published cajeta toolchain, builds the codec
# .cja + the cajeta-unit dependency, runs the test suite (and the GPU-decode
# oracle on the CPU backend), and — on a v* tag — publishes the built .cja as a
# GitHub Release asset.
#
# Triggers:
#   - push to main / PR        → build + test (no publish)
#   - push a `v*` tag          → build + test + publish the Release
#   - workflow_dispatch        → dry-run (build+test) or production (also tags +
#                                publishes, reading VERSION)
#
# TOOLCHAIN DEPENDENCY (important): the codec's typed facades (Protobuf/Ion/Avro
# parse<T> + toBytes<T>) require the codec *synthesizers*, which live in cajeta
# `main` but are NOT in any published release yet (latest is v0.7.1). CI will be
# fully green only once a cajeta release that includes them ships — then bump
# CAJETA_VERSION below. Until then the pure-Cajeta paths (columnar/Parquet/ORC)
# build, but the typed-codec tests need the newer toolchain.

name: release

on:
  push:
    # Per-commit CI on main is intentionally disabled until CAJETA_VERSION points
    # at a release containing the codec synthesizers (see note above) — otherwise
    # every push would go red on the typed-codec tests. Uncomment then:
    # branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'dry-run'
        options: [dry-run, production]

permissions:
  contents: write   # publish the Release on a tag / production run

env:
  # A published cajeta toolchain that contains the codec synthesizers. Bump when
  # the next cajeta release ships them. Must match a release tag of jklappenbach/cajeta.
  # 0.9.5 carries the codec synthesizers + the widened-reader intrinsics
  # (Cajeta.bitsToF32/F64). The Arrow BRIDGE (run-bridge-test.sh) additionally
  # needs cajeta.nucleo.* — unreleased until nucleo-frame ships; that step is
  # non-blocking below and goes green once a nucleo-carrying release is pinned.
  CAJETA_VERSION: v0.9.5

jobs:
  # Build the native zlib archives for every target so the .cja packaging step
  # bakes native/<platform>/libcajeta_zlib.a into the published archive (Unit 7).
  native-linux:
    name: native archives (linux x3 + windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu gcc-mingw-w64-x86-64
      - name: Cross-build native archives
        run: ./native/cross-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: |
            native/linux-x64/libcajeta_zlib.a
            native/linux-arm64/libcajeta_zlib.a
            native/linux-riscv64/libcajeta_zlib.a
            native/windows-x64/libcajeta_zlib.a
          if-no-files-found: error

  native-macos:
    name: native archives (macos arm64 + x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build macOS archives
        run: |
          SDK="$(xcrun --show-sdk-path)"
          CC_macos_arm64="clang -arch arm64  -isysroot $SDK" \
          CC_macos_x64="clang -arch x86_64 -isysroot $SDK" \
          ./native/cross-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: |
            native/macos-arm64/libcajeta_zlib.a
            native/macos-x64/libcajeta_zlib.a
          if-no-files-found: error

  build-test:
    name: build + test (x86_64-linux)
    runs-on: ubuntu-latest
    needs: [native-linux, native-macos]
    steps:
      - name: Checkout cajeta-codec
        uses: actions/checkout@v4

      - name: Download native archives (all six platforms)
        uses: actions/download-artifact@v4
        with:
          path: _native_dl
      - name: Assemble the native/ tree for baking
        run: |
          set -euo pipefail
          for p in linux-x64 linux-arm64 linux-riscv64 windows-x64 macos-arm64 macos-x64; do
            a="$(find _native_dl -path "*${p}*" -name libcajeta_zlib.a | head -1 || true)"
            if [ -n "$a" ]; then mkdir -p "native/$p"; cp "$a" "native/$p/"; echo "placed $p"; \
            else echo "::warning::no native archive for $p"; fi
          done

      - name: Checkout cajeta-unit (test framework dependency)
        uses: actions/checkout@v4
        with:
          repository: jklappenbach/cajeta-unit
          path: cajeta-unit-dep

      - name: Install cajeta toolchain (${{ env.CAJETA_VERSION }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CAJETA_VERSION" --repo jklappenbach/cajeta \
            --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          cajeta --version || cajeta version || true

      - name: Run the codec test suite
        env:
          # run-tests.sh defaults UNIT_REPO to ../cajeta-unit relative to the repo.
          UNIT_REPO: ${{ github.workspace }}/cajeta-unit-dep
        run: ./run-tests.sh

      - name: Run the GPU-decode oracle (CPU backend)
        # The XPU surface (GpuBuffer<T>) lives on cajeta feature branches —
        # no RELEASED toolchain compiles gpu/ yet, and gpu/ is not part of
        # the released .cja. Non-blocking until the XPU work ships in a
        # cajeta release.
        continue-on-error: true
        run: ./run-gpu-decode.sh cpu

      - name: Run the Arrow bridge test (parquet -> Arrow -> Table<R>)
        # The cross-repo integration (nucleo-frame U17): parquet decode crosses
        # the Arrow C Data Interface into a typed stdlib Table<R>. It depends on
        # cajeta.nucleo.column + cajeta.nucleo.frame, which are UNRELEASED at
        # authoring time, so this is RED until CAJETA_VERSION points at a release
        # carrying nucleo — deliberately non-blocking (like the GPU oracle), and
        # kept out of run-tests.sh so a nucleo import never fails the whole suite.
        continue-on-error: true
        env:
          CAJETA: cajeta
          UNIT_REPO: ${{ github.workspace }}/cajeta-unit-dep
        run: ./run-bridge-test.sh

      - name: Build the release .cja (bakes native/<platform>/ for all present)
        id: build
        env:
          # The packaging step bakes every resolvable native/<platform>/*.a into
          # the .cja's native/ tree (spec §3.3). Point it at the assembled tree.
          CAJETA_NATIVE_PATH: ${{ github.workspace }}/native
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          out="$(mktemp -d)"
          cajeta --emit=cja -o "$out/dev.cajeta.codec-${VERSION}.cja" \
            dev.cajeta.codec.protobuf.Protobuf.run src/main/cajeta "$out"
          mkdir -p dist
          cp "$out/dev.cajeta.codec-${VERSION}.cja" dist/
          echo "artifact=dist/dev.cajeta.codec-${VERSION}.cja" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify the native artifacts baked into the .cja
        run: |
          set -euo pipefail
          cja="${{ steps.build.outputs.artifact }}"
          miss=0
          for p in linux-x64 linux-arm64 linux-riscv64 windows-x64 macos-arm64 macos-x64; do
            if cajeta archive list "$cja" | grep -q "native/$p/libcajeta_zlib.a"; then
              echo "baked: $p"
            else
              echo "::error::native artifact NOT baked for $p"; miss=1
            fi
          done
          exit $miss

      - name: Upload .cja as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-codec-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.artifact }}

      # Publish a GitHub Release only on a v* tag push, or a production dispatch.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.build.outputs.version) }}
          name: cajeta-codec ${{ steps.build.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.artifact }}

      # Signed publish to the Olla registry (olla.cajeta.dev). Requires the
      # OLLA_* repo/org secrets; see cajeta/docs/olla-ci-publish.md.
      - name: Publish to Olla
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: jklappenbach/cajeta/.github/actions/olla-publish@main
        with:
          cja-path: ${{ steps.build.outputs.artifact }}
          version: ${{ steps.build.outputs.version }}
          token: ${{ secrets.OLLA_TOKEN }}
          signing-key-pem: ${{ secrets.OLLA_SIGNING_KEY_PEM }}
          signing-key-id: ${{ secrets.OLLA_SIGNING_KEY_ID }}
