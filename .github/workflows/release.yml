# CI + release for the cajeta-codec library (.cja).
#
# Unlike the cajeta compiler's release (which cross-builds binaries), this is a
# pure-Cajeta library: CI installs a published cajeta toolchain, builds the codec
# .cja + the cajeta-unit dependency, runs the test suite (and the GPU-decode
# oracle on the CPU backend), and — on a v* tag — publishes the built .cja as a
# GitHub Release asset.
#
# Triggers:
#   - push to main             → build + test (no publish)
#   - push a `v*` tag          → build + test + publish the Release
#   - workflow_dispatch        → dry-run (build+test) or production (also tags +
#                                publishes)
#
# No `pull_request:` trigger by design — this project lands changes by pushing
# straight to main, so a PR trigger would never fire and main-push CI is the
# only thing standing between a bad commit and a tag.

name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'dry-run'
        options: [dry-run, production]

permissions:
  contents: write   # publish the Release on a tag / production run

env:
  # Must match a release tag of jklappenbach/cajeta. Floors: v0.10.1 for the
  # bracket array literals these sources use; v0.12.1 for the tour, which is
  # authored and verified against the 0.12 line (try/finally, the typed-facade
  # synthesis across the .cja boundary).
  CAJETA_VERSION: v0.12.1

jobs:
  # Build the native zlib archives for every target so the .cja packaging step
  # bakes native/<platform>/libcajeta_zlib.a into the published archive (Unit 7).
  native-linux:
    name: native archives (linux x3 + windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu gcc-mingw-w64-x86-64
      - name: Cross-build native archives
        run: ./native/cross-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: |
            native/linux-x64/libcajeta_zlib.a
            native/linux-arm64/libcajeta_zlib.a
            native/linux-riscv64/libcajeta_zlib.a
            native/windows-x64/libcajeta_zlib.a
          if-no-files-found: error

  native-macos:
    name: native archives (macos arm64 + x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build macOS archives
        run: |
          SDK="$(xcrun --show-sdk-path)"
          CC_macos_arm64="clang -arch arm64  -isysroot $SDK" \
          CC_macos_x64="clang -arch x86_64 -isysroot $SDK" \
          ./native/cross-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: |
            native/macos-arm64/libcajeta_zlib.a
            native/macos-x64/libcajeta_zlib.a
          if-no-files-found: error

  build-test:
    name: build + test (x86_64-linux)
    runs-on: ubuntu-latest
    needs: [native-linux, native-macos]
    steps:
      - name: Checkout cajeta-codec
        uses: actions/checkout@v4

      - name: Download native archives (all six platforms)
        uses: actions/download-artifact@v4
        with:
          path: _native_dl
      - name: Assemble the native/ tree for baking
        run: |
          set -euo pipefail
          for p in linux-x64 linux-arm64 linux-riscv64 windows-x64 macos-arm64 macos-x64; do
            a="$(find _native_dl -path "*${p}*" -name libcajeta_zlib.a | head -1 || true)"
            if [ -n "$a" ]; then mkdir -p "native/$p"; cp "$a" "native/$p/"; echo "placed $p"; \
            else echo "::warning::no native archive for $p"; fi
          done

      - name: Checkout cajeta-unit (test framework dependency)
        uses: actions/checkout@v4
        with:
          repository: jklappenbach/cajeta-unit
          path: cajeta-unit-dep

      - name: Install cajeta toolchain (${{ env.CAJETA_VERSION }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CAJETA_VERSION" --repo jklappenbach/cajeta \
            --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          cajeta --version || cajeta version || true

      - name: Run the codec test suite
        env:
          # run-tests.sh defaults UNIT_REPO to ../cajeta-unit relative to the repo.
          UNIT_REPO: ${{ github.workspace }}/cajeta-unit-dep
        run: ./run-tests.sh

      - name: Run the codec tour (self-checking demos)
        # The tour is the library's living documentation and a smoke test in
        # one: every demo verifies its own output via check(), so a nonzero
        # exit means a demonstrated contract regressed. run-tour.sh builds
        # the native zlib backend itself and sets CAJETA_NATIVE_PATH.
        run: ./samples/tour/run-tour.sh

      - name: Tour coverage gate (every public type toured)
        # Fails if any public top-level type is not exercised by the tour;
        # scripts/tour-coverage-ignore.txt exempts genuine internals, each
        # with a stated reason. CAJETA must be a path (the script -x checks
        # it), so resolve the installed binary.
        run: |
          CAJETA="$(command -v cajeta)" ./scripts/check-library-tour-coverage.sh \
            src/main/cajeta samples/tour scripts/tour-coverage-ignore.txt

      - name: Run the GPU-decode oracle (CPU backend)
        # Blocking as of v0.7.1. It was continue-on-error while blocked on an
        # unreleased XPU surface (GpuBuffer<T> "lives on cajeta feature
        # branches"); gpu -> xpu collapsed, the types ship as
        # cajeta.xpu.KernelBuffer / KernelStream / KernelThread, and this has
        # passed green since. A step that cannot fail is not a test.
        env:
          # Same as the bridge test below: without this the oracle exe fails to
          # LINK ("native library 'cajeta_zlib' (linux-x64) not found"), so the
          # script execs a binary that was never built and exits 127.
          CAJETA_NATIVE_PATH: ${{ github.workspace }}/native
        run: ./run-gpu-decode.sh cpu

      - name: Run the Arrow bridge test (parquet -> Arrow -> Table<R>)
        # The cross-repo integration (nucleo-frame U17): parquet decode crosses
        # the Arrow C Data Interface into a typed stdlib Table<R>. Blocking as of
        # v0.7.1 — it was non-blocking while cajeta.nucleo.column/frame were
        # unreleased, and CAJETA_VERSION now points at a release carrying them.
        # Still kept out of run-tests.sh so a nucleo import cannot fail the
        # whole suite, but its own step must now pass.
        env:
          CAJETA: cajeta
          UNIT_REPO: ${{ github.workspace }}/cajeta-unit-dep
          # Without this the bridge exe fails to LINK ("native library
          # 'cajeta_zlib' (linux-x64) not found; searched: ~/.cajeta/native"),
          # so run-bridge-test.sh then execs a file that was never produced and
          # exits 127 — a failure mode unrelated to the nucleo gap above, which
          # would keep this step red even after nucleo ships. Point it at the
          # tree assembled earlier, exactly as the packaging step does.
          CAJETA_NATIVE_PATH: ${{ github.workspace }}/native
        run: ./run-bridge-test.sh

      - name: Build the release .cja (bakes native/<platform>/ for all present)
        id: build
        env:
          # The packaging step bakes every resolvable native/<platform>/*.a into
          # the .cja's native/ tree (spec §3.3). Point it at the assembled tree.
          CAJETA_NATIVE_PATH: ${{ github.workspace }}/native
        run: |
          set -euo pipefail
          # cajeta.json is the single source of truth for the version — it is what
          # the toolchain, the archive identity and dependency resolution all key
          # off. A VERSION file used to sit alongside it and CI read THAT, so a
          # bump to one and not the other shipped v0.7.1 as a 0.7.0 artifact and
          # published 0.7.0 to Olla. Ask the toolchain rather than parsing the
          # manifest here: it is JSONC (42 comment lines), so jq cannot read it and
          # naive comment-stripping corrupts the `//` inside https:// URLs.
          VERSION="$(cajeta info | awk '/^[[:space:]]*version:/{print $2; exit}')"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from cajeta.json via 'cajeta info'" >&2
            exit 1
          fi
          echo "version from cajeta.json: $VERSION"
          out="$(mktemp -d)"
          cajeta --emit=cja -o "$out/dev.cajeta.codec-${VERSION}.cja" \
            dev.cajeta.codec.protobuf.Protobuf.run src/main/cajeta "$out"
          mkdir -p dist
          cp "$out/dev.cajeta.codec-${VERSION}.cja" dist/
          echo "artifact=dist/dev.cajeta.codec-${VERSION}.cja" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify host artifact baked + stage per-platform assets
        run: |
          set -euo pipefail
          cja="${{ steps.build.outputs.artifact }}"
          # The toolchain bakes ONLY the build host's platform (linux-x64 here);
          # multi-platform baking from one host is unimplemented (plan 7.7). So
          # the .cja is self-contained for linux-x64; every other platform's
          # archive ships as a release asset for CAJETA_NATIVE_PATH provisioning
          # (see native/CROSS-BUILD.md "Consuming the native backend").
          if cajeta archive list "$cja" | grep -q "native/linux-x64/libcajeta_zlib.a"; then
            echo "baked host platform into the .cja: linux-x64"
          else
            echo "::error::host native artifact NOT baked into the .cja"; exit 1
          fi
          mkdir -p dist
          for p in linux-x64 linux-arm64 linux-riscv64 windows-x64 macos-arm64 macos-x64; do
            if [ -f "native/$p/libcajeta_zlib.a" ]; then
              cp "native/$p/libcajeta_zlib.a" "dist/libcajeta_zlib-$p.a"; echo "staged asset: $p"
            else
              echo "::warning::missing native archive for $p"
            fi
          done
          ls -l dist/

      - name: Upload .cja + native archives as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-codec-${{ steps.build.outputs.version }}
          path: |
            ${{ steps.build.outputs.artifact }}
            dist/libcajeta_zlib-*.a

      # Publish a GitHub Release only on a v* tag push, or a production dispatch.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.build.outputs.version) }}
          name: cajeta-codec ${{ steps.build.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.artifact }}
            dist/libcajeta_zlib-*.a

      # Signed publish to the Olla registry (olla.cajeta.dev). Requires the
      # OLLA_* repo/org secrets; see cajeta/docs/olla-ci-publish.md.
      - name: Publish to Olla
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: jklappenbach/cajeta/.github/actions/olla-publish@main
        with:
          cja-path: ${{ steps.build.outputs.artifact }}
          version: ${{ steps.build.outputs.version }}
          token: ${{ secrets.OLLA_TOKEN }}
          signing-key-pem: ${{ secrets.OLLA_SIGNING_KEY_PEM }}
          signing-key-id: ${{ secrets.OLLA_SIGNING_KEY_ID }}
